<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ASTERRA</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#scene {
    width: 100%;
    height: 100%;
}

#status {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 10;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 14px;
}
</style>
</head>

<body>

<div id="scene"></div>
<div id="status">ASTERRA — LOADING 3D...</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

const status = document.getElementById("status");

if (typeof THREE === "undefined") {

    status.textContent =
        "ERROR: THREE.JS DID NOT LOAD";

    throw new Error("Three.js failed to load");
}


/* SCENE */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x000000);


/* CAMERA */

const camera =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        2000
    );

camera.position.z = 500;


/* RENDERER */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

document
    .getElementById("scene")
    .appendChild(renderer.domElement);


/* LIGHT */

const ambient =
    new THREE.AmbientLight(
        0xffffff,
        0.5
    );

scene.add(ambient);


const light =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

light.position.set(
    -200,
    200,
    400
);

scene.add(light);


/* PLANET */

const geometry =
    new THREE.SphereGeometry(
        150,
        96,
        96
    );


const material =
    new THREE.MeshStandardMaterial({
        color: 0x888888,
        roughness: 0.9,
        metalness: 0
    });


const planet =
    new THREE.Mesh(
        geometry,
        material
    );


scene.add(planet);


/* MOUSE ROTATION */

let dragging = false;
let lastX = 0;
let lastY = 0;

renderer.domElement.addEventListener(
    "pointerdown",
    function(e) {

        dragging = true;

        lastX = e.clientX;
        lastY = e.clientY;
    }
);


renderer.domElement.addEventListener(
    "pointermove",
    function(e) {

        if (!dragging) return;

        const dx =
            e.clientX - lastX;

        const dy =
            e.clientY - lastY;

        planet.rotation.y +=
            dx * 0.005;

        planet.rotation.x +=
            dy * 0.005;

        lastX = e.clientX;
        lastY = e.clientY;
    }
);


renderer.domElement.addEventListener(
    "pointerup",
    function() {

        dragging = false;
    }
);


renderer.domElement.addEventListener(
    "pointerleave",
    function() {

        dragging = false;
    }
);


/* ZOOM */

let zoom = 500;

renderer.domElement.addEventListener(
    "wheel",
    function(e) {

        e.preventDefault();

        zoom += e.deltaY * 0.5;

        zoom =
            Math.max(
                300,
                Math.min(
                    800,
                    zoom
                )
            );
    },
    { passive: false }
);


/* ANIMATION */

function animate() {

    requestAnimationFrame(
        animate
    );

    camera.position.z +=
        (zoom - camera.position.z) *
        0.08;

    renderer.render(
        scene,
        camera
    );
}


/* RESIZE */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


status.textContent =
    "ASTERRA — 3D ONLINE";


animate();

</script>

</body>
</html>
