<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASTERRA — Own Your World</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #020305;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
    }

    #scene {
        position: fixed;
        inset: 0;
        z-index: 1;
    }

    canvas {
        display: block;
    }

    .space-glow {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background:
            radial-gradient(
                circle at 70% 50%,
                rgba(40,70,100,0.10),
                transparent 38%
            ),
            radial-gradient(
                circle at 20% 80%,
                rgba(30,50,80,0.08),
                transparent 35%
            );
    }

    .top {
        position: fixed;
        top: 30px;
        left: 38px;
        right: 38px;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        pointer-events: none;
    }

    .brand {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 7px;
    }

    .brand span {
        opacity: .45;
        font-weight: 400;
    }

    .world-switch {
        display: flex;
        gap: 8px;
        pointer-events: auto;
    }

    .world-btn {
        border: 1px solid rgba(255,255,255,.18);
        background: rgba(4,7,11,.72);
        color: rgba(255,255,255,.58);
        padding: 9px 17px;
        border-radius: 3px;
        font-size: 11px;
        letter-spacing: 2px;
        cursor: pointer;
        transition: .25s ease;
        backdrop-filter: blur(8px);
    }

    .world-btn:hover {
        color: white;
        border-color: rgba(255,255,255,.42);
    }

    .world-btn.active {
        color: white;
        border-color: rgba(255,255,255,.7);
        background: rgba(255,255,255,.08);
    }

    .left-panel {
        position: fixed;
        left: 38px;
        top: 50%;
        transform: translateY(-50%);
        z-index: 10;
        width: 320px;
        pointer-events: none;
    }

    .eyebrow {
        font-size: 10px;
        letter-spacing: 4px;
        color: rgba(255,255,255,.42);
        margin-bottom: 20px;
    }

    h1 {
        margin: 0;
        font-size: clamp(42px, 5vw, 76px);
        line-height: .94;
        letter-spacing: -3px;
        font-weight: 600;
    }

    .tagline {
        margin-top: 20px;
        font-size: 13px;
        line-height: 1.7;
        color: rgba(255,255,255,.54);
        max-width: 280px;
    }

    .cta {
        margin-top: 32px;
        display: inline-block;
        padding: 13px 20px;
        border: 1px solid rgba(255,255,255,.25);
        color: white;
        font-size: 10px;
        letter-spacing: 3px;
        text-transform: uppercase;
        background: rgba(255,255,255,.035);
    }

    .bottom {
        position: fixed;
        bottom: 28px;
        left: 38px;
        right: 38px;
        z-index: 10;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        pointer-events: none;
    }

    .status {
        font-size: 9px;
        letter-spacing: 2px;
        color: rgba(255,255,255,.30);
    }

    .controls {
        font-size: 9px;
        letter-spacing: 2px;
        color: rgba(255,255,255,.28);
        text-align: right;
        line-height: 1.8;
    }

    .loading {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 20;
        font-size: 10px;
        letter-spacing: 4px;
        color: rgba(255,255,255,.55);
        transition: opacity .5s ease;
        pointer-events: none;
    }

    @media(max-width: 800px) {
        .left-panel {
            left: 22px;
            width: 260px;
        }

        .top {
            left: 22px;
            right: 22px;
        }

        .bottom {
            left: 22px;
            right: 22px;
        }

        h1 {
            font-size: 46px;
        }
    }
</style>
</head>

<body>

<div id="scene"></div>
<div class="space-glow"></div>

<div class="loading" id="loading">LOADING ASTERRA</div>

<div class="top">
    <div class="brand">
        ASTERRA <span>EXPLORATION</span>
    </div>

    <div class="world-switch">
        <button class="world-btn active" id="moonBtn">MOON</button>
        <button class="world-btn" id="marsBtn">MARS</button>
    </div>
</div>

<div class="left-panel">
    <div class="eyebrow">VIRTUAL UNIVERSE</div>

    <h1 id="title">ENTER<br>THE MOON</h1>

    <div class="tagline" id="tagline">
        Explore a digital representation of the lunar surface,
        built from planetary elevation data.
    </div>

    <div class="cta">
        DISCOVER SURFACE
    </div>
</div>

<div class="bottom">
    <div class="status" id="status">
        NASA LOLA TERRAIN DATA
    </div>

    <div class="controls">
        DRAG — ROTATE<br>
        WHEEL — ZOOM
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
/* =========================================================
   ASTERRA
   Stable planetary viewer
   NASA terrain sources:
   Moon  = LROC + LOLA
   Mars  = MOLA
   ========================================================= */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    3000
);

let zoomDistance = 520;
let targetZoom = 520;

const MIN_ZOOM = 370;
const MAX_ZOOM = 760;

camera.position.set(0, 0, zoomDistance);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: false
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 1.8)
);

renderer.outputEncoding = THREE.sRGBEncoding;

renderer.setClearColor(0x020305, 1);

document.getElementById("scene").appendChild(
    renderer.domElement
);


/* =========================================================
   LIGHT
   ========================================================= */

const ambient = new THREE.AmbientLight(
    0xffffff,
    0.48
);

scene.add(ambient);

const sun = new THREE.DirectionalLight(
    0xffffff,
    2.4
);

sun.position.set(
    -250,
    180,
    420
);

scene.add(sun);

const fill = new THREE.DirectionalLight(
    0x7188aa,
    0.32
);

fill.position.set(
    250,
    -100,
    -300
);

scene.add(fill);


/* =========================================================
   STAR FIELD
   ========================================================= */

const starGeometry = new THREE.BufferGeometry();

const starCount = 430;

const starPositions = new Float32Array(
    starCount * 3
);

for (let i = 0; i < starCount; i++) {

    const radius = 900 + Math.random() * 650;

    const theta =
        Math.random() * Math.PI * 2;

    const phi =
        Math.acos(
            2 * Math.random() - 1
        );

    starPositions[i * 3] =
        radius *
        Math.sin(phi) *
        Math.cos(theta);

    starPositions[i * 3 + 1] =
        radius *
        Math.cos(phi);

    starPositions[i * 3 + 2] =
        radius *
        Math.sin(phi) *
        Math.sin(theta);
}

starGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        starPositions,
        3
    )
);

const starMaterial =
    new THREE.PointsMaterial({
        color: 0xffffff,
        size: 1.7,
        sizeAttenuation: true,
        transparent: true,
        opacity: 0.65
    });

const stars =
    new THREE.Points(
        starGeometry,
        starMaterial
    );

scene.add(stars);


/* =========================================================
   PLANET GROUP
   ========================================================= */

const planetGroup =
    new THREE.Group();

scene.add(planetGroup);

let planet = null;

let currentWorld = "moon";


/* =========================================================
   NASA TEXTURES
   ========================================================= */

const loader =
    new THREE.TextureLoader();

loader.setCrossOrigin("anonymous");


const MOON_COLOR =
    "https://svs.gsfc.nasa.gov/vis/a000000/a004700/a004720/lroc_color_2k.jpg";

const MOON_HEIGHT =
    "https://svs.gsfc.nasa.gov/vis/a000000/a004700/a004720/ldem_3_8bit.jpg";

const MARS_TOPO =
    "https://svs.gsfc.nasa.gov/vis/a000000/a004400/a004436/mars_cyl_topo2.jpg";


/* =========================================================
   PLANET CREATION
   ========================================================= */

function createMoon() {

    removePlanet();

    const geometry =
        new THREE.SphereGeometry(
            150,
            192,
            96
        );

    const material =
        new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.94,
            metalness: 0
        });

    planet =
        new THREE.Mesh(
            geometry,
            material
        );

    planet.rotation.y = -0.45;

    planetGroup.add(planet);

    /* ---------- COLOR ---------- */

    loader.load(
        MOON_COLOR,

        function(texture) {

            texture.encoding =
                THREE.sRGBEncoding;

            texture.anisotropy =
                renderer.capabilities
                    .getMaxAnisotropy();

            material.map = texture;

            material.needsUpdate = true;
        },

        undefined,

        function() {

            console.log(
                "Moon color texture failed."
            );

        }
    );


    /* ---------- LOLA HEIGHT ---------- */

    loader.load(
        MOON_HEIGHT,

        function(texture) {

            material.displacementMap =
                texture;

            /*
               The real lunar relief is subtle
               compared with the Moon's radius.

               This value exaggerates it slightly
               so the terrain remains visible
               at normal browser zoom.
            */

            material.displacementScale =
                1.15;

            material.displacementBias =
                -0.55;

            material.bumpMap =
                texture;

            material.bumpScale =
                0.22;

            material.needsUpdate = true;
        },

        undefined,

        function() {

            console.log(
                "Moon LOLA height texture failed."
            );

        }
    );
}


function createMars() {

    removePlanet();

    const geometry =
        new THREE.SphereGeometry(
            150,
            192,
            96
        );

    /*
       NASA MOLA topography is a false-color
       elevation map.

       The red/brown material tint converts
       the very bright scientific color palette
       into a darker Mars-like appearance while
       retaining the actual MOLA terrain pattern.
    */

    const material =
        new THREE.MeshStandardMaterial({

            color: 0x9a3f24,

            roughness: 0.92,

            metalness: 0,

            bumpScale: 0.22
        });

    planet =
        new THREE.Mesh(
            geometry,
            material
        );

    planet.rotation.y = 0.55;

    planetGroup.add(planet);


    loader.load(
        MARS_TOPO,

        function(texture) {

            texture.encoding =
                THREE.sRGBEncoding;

            texture.anisotropy =
                renderer.capabilities
                    .getMaxAnisotropy();

            material.map =
                texture;

            /*
               The same MOLA topography is also
               used as a subtle bump map.
            */

            material.bumpMap =
                texture;

            material.bumpScale =
                0.16;

            material.needsUpdate = true;

        },

        undefined,

        function() {

            console.log(
                "Mars MOLA texture failed."
            );

            /*
               The planet itself remains visible
               even if NASA's external texture
               cannot be loaded.
            */
        }
    );
}


/* =========================================================
   REMOVE CURRENT PLANET
   ========================================================= */

function removePlanet() {

    if (!planet) return;

    planetGroup.remove(planet);

    if (planet.geometry) {
        planet.geometry.dispose();
    }

    if (planet.material) {

        if (planet.material.map) {
            planet.material.map.dispose();
        }

        if (planet.material.bumpMap) {
            planet.material.bumpMap.dispose();
        }

        if (planet.material.displacementMap) {
            planet.material.displacementMap.dispose();
        }

        planet.material.dispose();
    }

    planet = null;
}


/* =========================================================
   UI
   ========================================================= */

const title =
    document.getElementById("title");

const tagline =
    document.getElementById("tagline");

const status =
    document.getElementById("status");

const moonBtn =
    document.getElementById("moonBtn");

const marsBtn =
    document.getElementById("marsBtn");


function setWorld(world) {

    currentWorld = world;

    if (world === "moon") {

        moonBtn.classList.add("active");
        marsBtn.classList.remove("active");

        title.innerHTML =
            "ENTER<br>THE MOON";

        tagline.innerHTML =
            "Explore a digital representation of the lunar surface, built from NASA LROC imagery and LOLA elevation data.";

        status.innerHTML =
            "NASA LOLA + LROC TERRAIN DATA";

        createMoon();

    } else {

        marsBtn.classList.add("active");
        moonBtn.classList.remove("active");

        title.innerHTML =
            "ENTER<br>MARS";

        tagline.innerHTML =
            "Explore a digital representation of Mars built from NASA Mars Global Surveyor MOLA global topography.";

        status.innerHTML =
            "NASA MOLA TERRAIN DATA";

        createMars();
    }
}


moonBtn.addEventListener(
    "click",
    function() {
        setWorld("moon");
    }
);

marsBtn.addEventListener(
    "click",
    function() {
        setWorld("mars");
    }
);


/* =========================================================
   MOUSE ROTATION
   ========================================================= */

let dragging = false;

let previousX = 0;
let previousY = 0;

let velocityX = 0;
let velocityY = 0;


renderer.domElement.addEventListener(
    "pointerdown",
    function(e) {

        dragging = true;

        previousX = e.clientX;
        previousY = e.clientY;

        velocityX = 0;
        velocityY = 0;

        renderer.domElement.setPointerCapture(
            e.pointerId
        );
    }
);


renderer.domElement.addEventListener(
    "pointermove",
    function(e) {

        if (!dragging || !planet)
            return;

        const dx =
            e.clientX - previousX;

        const dy =
            e.clientY - previousY;

        previousX = e.clientX;
        previousY = e.clientY;

        velocityX =
            dx * 0.006;

        velocityY =
            dy * 0.004;

        planet.rotation.y +=
            velocityX;

        planet.rotation.x +=
            velocityY;

        const limit =
            Math.PI * 0.43;

        planet.rotation.x =
            Math.max(
                -limit,
                Math.min(
                    limit,
                    planet.rotation.x
                )
            );
    }
);


renderer.domElement.addEventListener(
    "pointerup",
    function(e) {

        dragging = false;

        try {
            renderer.domElement
                .releasePointerCapture(
                    e.pointerId
                );
        } catch(err) {}
    }
);


renderer.domElement.addEventListener(
    "pointercancel",
    function() {

        dragging = false;
    }
);


/* =========================================================
   ZOOM
   ========================================================= */

renderer.domElement.addEventListener(
    "wheel",
    function(e) {

        e.preventDefault();

        targetZoom +=
            e.deltaY * 0.35;

        targetZoom =
            Math.max(
                MIN_ZOOM,
                Math.min(
                    MAX_ZOOM,
                    targetZoom
                )
            );

    },
    {
        passive: false
    }
);


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* =========================================================
   ANIMATION
   ========================================================= */

let time = 0;

function animate() {

    requestAnimationFrame(animate);

    time += 0.01;


    /*
       Very subtle automatic rotation.
       When the user drags, their movement dominates.
    */

    if (
        planet &&
        !dragging
    ) {

        planet.rotation.y +=
            0.0008;

        planet.rotation.y +=
            velocityX * 0.25;

        planet.rotation.x +=
            velocityY * 0.25;

        velocityX *= 0.94;
        velocityY *= 0.94;
    }


    /*
       Smooth zoom.
    */

    zoomDistance +=
        (targetZoom - zoomDistance)
        * 0.08;

    camera.position.z =
        zoomDistance;


    /*
       Very subtle star variation.
    */

    starMaterial.opacity =
        0.55 +
        Math.sin(time * 0.7) * 0.08;


    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   START
   ========================================================= */

setWorld("moon");

animate();


/*
   Hide loading indicator shortly after
   Three.js starts rendering.
*/

setTimeout(
    function() {

        const loading =
            document.getElementById(
                "loading"
            );

        loading.style.opacity = "0";

        setTimeout(
            function() {
                loading.remove();
            },
            600
        );

    },
    900
);

</script>

</body>
</html>
